[project]
name = "xiaocai-stock-ai"
version = "1.0.0"
description = "开源的 A 股问答引擎: 数据取证 + 分析策略 + 硬底线"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{name = "Fisher0012"}]
requires-python = ">=3.10"
keywords = ["stock", "china-a-share", "ai", "finance", "llm", "mcp"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/Fisher0012/xiaocai-stock-ai"
Issues = "https://github.com/Fisher0012/xiaocai-stock-ai/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
